name: SSHKeychainApp
options:
  bundleIdPrefix: com.josegonzalez
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    DEAD_CODE_STRIPPING: YES
    ENABLE_HARDENED_RUNTIME: YES

packages:
  SSHKeychainCore:
    path: ..
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.2

targets:
  SSHKeychainApp:
    type: application
    platform: macOS
    sources:
      - path: SSHKeychainApp
        excludes:
          - "Library/LaunchAgents/**"
      - path: SSHKeychainApp/Library/LaunchAgents/com.josegonzalez.ssh-keychain.plist
        # Bundle the launch agent plist at Contents/Library/LaunchAgents/ -
        # the canonical path SMAppService.agent(plistName:) looks up.
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: "Contents/Library/LaunchAgents"
    info:
      path: SSHKeychainApp/Info.plist
      properties:
        CFBundleName: SSH Keychain
        CFBundleDisplayName: SSH Keychain
        CFBundleIdentifier: com.josegonzalez.ssh-keychain
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundlePackageType: APPL
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true                # menu-bar app: no Dock icon, no main window
        NSHumanReadableCopyright: "Copyright © 2026 Jose Diaz-Gonzalez. MIT License."

        # Sparkle 2 auto-update config. The feed URL is a placeholder until the
        # GitHub Pages appcast goes live alongside the first signed DMG; the
        # EdDSA public key is the placeholder Sparkle ships in their template
        # and MUST be replaced before any real release. The actual private key
        # is generated with `Distribution/generate-sparkle-keys.sh` and lives
        # outside the repo.
        SUFeedURL: https://josediazgonzalez.com/ssh-keychain/appcast.xml
        SUPublicEDKey: "Azio7p0p4Wf1jzP+kjR83d+0QyB/mkTgN6VKUpFnvJ4="
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: false       # require user confirmation per update
        SUScheduledCheckInterval: 86400    # daily background check
    entitlements:
      path: SSHKeychainApp/SSHKeychainApp.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.cs.allow-jit: false
        com.apple.security.cs.disable-library-validation: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.josegonzalez.ssh-keychain
        # Bundle directory name (what shows up in Finder / Applications):
        PRODUCT_NAME: SSH Keychain
        # Executable inside Contents/MacOS/ stays as the CLI tool name so the
        # launch agent plist's ProgramArguments and the /usr/local/bin symlink
        # keep working unchanged.
        EXECUTABLE_NAME: ssh-keychain
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: SSHKeychainApp/SSHKeychainApp.entitlements
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"          # ad-hoc until a Developer ID is wired in
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - package: SSHKeychainCore
        product: SSHKeychainCore
      - package: Sparkle
        product: Sparkle
